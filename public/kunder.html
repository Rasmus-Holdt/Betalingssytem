<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betalinger</title>
<style>
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#f4f4f8; margin:0; padding:40px 20px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:22px; color:#1a1a2e;}
  a.back{font-size:13px; color:#635bff; text-decoration:none; font-weight:600;}
  table{width:100%; border-collapse:collapse; margin-top:20px; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,.06);}
  th, td{text-align:left; padding:12px 14px; font-size:14px;}
  th{background:#1a1a2e; color:#fff; font-weight:600;}
  tr:nth-child(even){background:#fafafa;}
  .empty{color:#6b7280; margin-top:20px; font-size:14px;}
  .badge{padding:3px 8px; border-radius:20px; font-size:11px; font-weight:700; background:#dcfce7; color:#166534;}
  .gate{max-width:340px; margin:80px auto 0; background:#fff; border-radius:12px; padding:28px; box-shadow:0 4px 20px rgba(0,0,0,.06);}
  .gate label{display:block; font-size:13px; font-weight:600; margin-bottom:6px;}
  .gate input{width:100%; padding:10px 12px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:14px; box-sizing:border-box;}
  .gate button{margin-top:14px; width:100%; padding:11px; background:#635bff; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;}
  .gate #gateError{color:#b91c1c; font-size:13px; margin-top:10px; display:none;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1 style="font-size:18px;">Log ind</h1>
  <form id="gateForm">
    <label for="gatePassword">Adgangskode</label>
    <input id="gatePassword" name="gatePassword" type="password" required>
    <button type="submit">Log ind</button>
    <div id="gateError">Forkert adgangskode.</div>
  </form>
</div>

<div class="wrap hidden" id="app">
  <a class="back" href="/">← Nyt betalingslink</a>
  <h1>Betalinger</h1>
  <div id="content">Henter…</div>
</div>

<script>
function getAdminPassword() {
  return sessionStorage.getItem('adminPassword') || '';
}

const gate = document.getElementById('gate');
const app = document.getElementById('app');
const gateForm = document.getElementById('gateForm');
const gateError = document.getElementById('gateError');

function showApp() {
  gate.classList.add('hidden');
  app.classList.remove('hidden');
  hentBetalinger();
}

function showGate(withError) {
  app.classList.add('hidden');
  gate.classList.remove('hidden');
  gateError.style.display = withError ? 'block' : 'none';
}

gateForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const value = document.getElementById('gatePassword').value;
  sessionStorage.setItem('adminPassword', value);
  showApp();
});

function hentBetalinger() {
  const el = document.getElementById('content');
  el.textContent = 'Henter…';
  fetch('/.netlify/functions/list-payments', {
    headers: { 'x-admin-password': getAdminPassword() }
  })
    .then(async (r) => {
      if (r.status === 401) {
        sessionStorage.removeItem('adminPassword');
        showGate(true);
        throw new Error('Forkert adgangskode');
      }
      return r.json();
    })
    .then(data => {
      if (!data.length) {
        el.innerHTML = '<p class="empty">Ingen betalinger endnu.</p>';
        return;
      }
      let rows = data.map(p => {
        const dele = [];
        if (p.engangsbeloeb > 0) dele.push(`${p.engangsbeloeb} ${p.valuta} engang`);
        if (p.maanedligbeloeb > 0) dele.push(`${p.maanedligbeloeb} ${p.valuta}/måned`);
        const beskrivelse = dele.join(' + ') || '–';
        return `
          <tr>
            <td>${p.navn}</td>
            <td>${beskrivelse}</td>
            <td>${new Date(p.dato).toLocaleString('da-DK')}</td>
            <td><span class="badge">Betalt</span></td>
          </tr>
        `;
      }).join('');
      el.innerHTML = `
        <table>
          <thead><tr><th>Kunde</th><th>Beløb</th><th>Dato</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    })
    .catch((err) => {
      if (err.message !== 'Forkert adgangskode') {
        el.innerHTML = '<p class="empty">Kunne ikke hente betalinger.</p>';
      }
    });
}

if (getAdminPassword()) {
  showApp();
}
</script>
</body>
</html>
